[package]
name = "gate-air-leaf"
version = "0.1.0"
edition = "2021"

# Standalone workspace, pinned to the recursion's stwo rev (74951f79) + nightly-2026-01-15 so the
# gate_air STARK proof is in the exact form circuits_stark_verifier (stwo-circuits 041ec6101ba782aa00e325433929cda6ef15c1b9) consumes
# in-circuit. Milestone 1: rev-align gate_air (native prove+verify on 74951f79). Milestone 2 adds
# the in-circuit verifier (circuits_stark_verifier).
[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
itertools = "0.12"
num-traits = "0.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
# CPU-vs-GPU full-proof byte-identity fingerprint (GATE_AIR_PROOF_HASH): stable SHA-256 over the
# serde-serialized StarkProof.
sha2 = "0.10"

stwo = { git = "https://github.com/starkware-libs/stwo", rev = "74951f79", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "74951f79", features = ["prover", "parallel"] }

# Milestone 2: in-circuit verification of the gate_air STARK proof (stwo-circuits 041ec6101ba782aa00e325433929cda6ef15c1b9 — same
# rev the recursion uses). Mirrors crates/stark_verifier_examples' deps.
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "041ec6101ba782aa00e325433929cda6ef15c1b9" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "041ec6101ba782aa00e325433929cda6ef15c1b9" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "041ec6101ba782aa00e325433929cda6ef15c1b9" }
indexmap = "2"

# Milestone 3: turn the verification circuit into a foldable leaf (a circuit-prover proof) and fold
# N leaves with the multiverifier tree. Same pattern + revs as iadd-recursion (the cairo leaf-gen).
recursive-aggregate = { path = "../../proving-utils/crates/recursive_aggregate" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "041ec6101ba782aa00e325433929cda6ef15c1b9", features = ["prover"] }
circuit-prover = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "041ec6101ba782aa00e325433929cda6ef15c1b9" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "041ec6101ba782aa00e325433929cda6ef15c1b9" }
circuit-multiverifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "041ec6101ba782aa00e325433929cda6ef15c1b9" }

# Device-resident gate_air GPU constraint kernel (registers into the generic CudaBackend prover).
gate-air-cuda-kernel = { path = "../gate-air-cuda-kernel", optional = true }

[features]
# K1/K4 GPU trace-gen kernels (gpu_tracegen.rs, via cudarc/NVRTC). `gpu` is the module gate;
# `gpu-cuda` adds the cudarc runtime (GPU box).
gpu = []
gpu-cuda = ["gpu", "dep:cudarc"]
# Device-resident CUDA prover backend: swaps ProverBackend -> CudaBackend (commit + prove_ex on the
# device) and installs the gate_air constraint kernel. Pulls gpu-cuda for the K1/K4 trace-gen glue.
cuda = [
    "stwo/cuda",
    "stwo-constraint-framework/cuda",
    "gpu-cuda",
    "dep:gate-air-cuda-kernel",
    "gate-air-cuda-kernel/cuda",
]

# cudarc for the K1/K4 trace-gen launch glue (gpu_tracegen.rs). MUST match stwo's cudarc (0.11).
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
cudarc = { version = "0.11", features = ["driver", "nvrtc", "cuda-12050"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cudarc = { version = "0.11", features = ["driver", "nvrtc"], optional = true }

# Redirect the git stwo (and constraint-framework) to the GENERIC device-resident CUDA backend
# (same rev 74951f79 + the CudaBackend). circuits@041ec610 + recursive-aggregate share the same
# stwo, so type identity holds. Without --features cuda this is byte-identical to upstream 74951f79.
[patch."https://github.com/starkware-libs/stwo"]
stwo = { path = "../../stwo-cuda-backend/crates/stwo" }
stwo-constraint-framework = { path = "../../stwo-cuda-backend/crates/constraint-framework" }
