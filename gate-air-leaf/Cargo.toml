[package]
name = "gate-air-leaf"
version = "0.1.0"
edition = "2021"

# Standalone workspace, pinned to the recursion's stwo rev (74951f79) + nightly-2026-01-15 so the
# gate_air STARK proof is in the exact form circuits_stark_verifier (stwo-circuits 0a6351e) consumes
# in-circuit. Milestone 1: rev-align gate_air (native prove+verify on 74951f79). Milestone 2 adds
# the in-circuit verifier (circuits_stark_verifier).
[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
itertools = "0.12"
num-traits = "0.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

stwo = { git = "https://github.com/starkware-libs/stwo", rev = "74951f79", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "74951f79", features = ["prover", "parallel"] }

# Milestone 2: in-circuit verification of the gate_air STARK proof (stwo-circuits 0a6351e — same
# rev the recursion uses). Mirrors crates/stark_verifier_examples' deps.
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "0a6351e" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "0a6351e" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "0a6351e" }
indexmap = "2"
