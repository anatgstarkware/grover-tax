[package]
name = "grover_tax_circuit"
version = "0.1.0"
edition = "2024_07"
description = "Cairo gate-execution circuit for grover-tax v0.1 (Stwo side)."
license = "MIT"

# `scarb execute` runs the `#[executable]` function and produces a
# Cairo PIE / standard-output file that `stwo-cairo`'s prover can
# consume. See `docs/apples-to-apples-v0.1.md`.
[[target.executable]]
name = "grover_tax_executable"
function = "grover_tax_circuit::apples_to_apples_executable"

[[target.executable]]
name = "iadd_sim_executable"
function = "grover_tax_circuit::qsim::iadd_sim_executable"

[cairo]
enable-gas = false

[dependencies]
cairo_execute = "2.15.0"

[dev-dependencies]
cairo_test = "2.15.0"
